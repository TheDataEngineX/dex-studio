    silver_entity_resolution:
      source: bronze_titles
      depends_on:
      - bronze_titles
      - bronze_tmdb_movie_details
      - bronze_tmdb_movie_ids
      transforms:
      - type: sql
        sql: "WITH matches AS (\n  SELECT\n    t.tconst AS tconst,\n    d.id AS tmdb_id,\n\
          \    CASE\n      WHEN LOWER(TRIM(t.primaryTitle)) = LOWER(TRIM(d.title))\
          \ THEN 1.0\n      ELSE 0.5\n    END AS match_confidence\n  FROM _data t\n\
          \  INNER JOIN bronze_tmdb_movie_details d\n    ON t.tconst = d.external_ids.imdb_id\n\
          \  WHERE d.external_ids.imdb_id IS NOT NULL\n),\ntotals AS (\n  SELECT COUNT(*)\
          \ AS curated_count FROM bronze_tmdb_movie_ids\n)\nSELECT\n  matches.*,\n\
          \  CASE\n    WHEN totals.curated_count = 0 THEN 0.0\n    ELSE COUNT(*) OVER\
          \ ()::DOUBLE / totals.curated_count\n  END AS match_rate\nFROM matches\n\
          CROSS JOIN totals\n"
      quality:
        completeness: 0.9
        uniqueness:
        - tconst
        custom_sql: SELECT MIN(match_rate) >= 0.80 FROM _data
      destination: silver_entity_resolution
      orm_sink:
        model: entity_resolution_match
        source_a_id: tconst
        source_b_id: tmdb_id
        confidence: match_confidence
      target:
        layer: silver
    silver_unified_cast_crew:
      source: bronze_tmdb_movie_details
      depends_on:
      - bronze_principals
      - bronze_names
      - bronze_tmdb_movie_details
      - silver_entity_resolution
      transforms:
      - type: sql
        sql: "SELECT\n  p.tconst                            AS resolved_title_id,\n\
          \  n.primaryName                       AS person_name,\n  p.category      \
          \                     AS role,\n  'imdb'                          AS source\n\
          FROM bronze_principals p\nLEFT JOIN bronze_names n ON p.nconst = n.nconst\n\
          INNER JOIN silver_movies sm ON p.tconst = sm.movie_id\nWHERE n.primaryName\
          \ IS NOT NULL\nUNION ALL\nSELECT\n  er.tconst               AS resolved_title_id,\n\
          \  cast_member.name       AS person_name,\n  cast_member.character  AS role,\n\
          \  'tmdb'                 AS source\nFROM _data d\nCROSS JOIN LATERAL (SELECT\
          \ * FROM json_each(to_json(d.credits)) -> '$.cast') AS cm(cast_member)\n\
          INNER JOIN silver_entity_resolution er ON d.id = er.tmdb_id\nWHERE cast_member.name\
          \ IS NOT NULL\n"
      quality:
        completeness: 0.7
      destination: silver_unified_cast_crew
      target:
        layer: silver
    silver_watch_providers_by_region:
      source: bronze_tmdb_movie_watch_providers
      depends_on:
      - bronze_tmdb_movie_watch_providers
      - bronze_tmdb_tv_watch_providers
      transforms:
      - type: sql
        sql: 'SELECT *, ''movie'' AS media_type

          FROM _data

          WHERE tmdb_id IS NOT NULL AND region IS NOT NULL AND provider_name IS NOT
          NULL

          UNION ALL

          SELECT *, ''tv'' AS media_type

          FROM bronze_tmdb_tv_watch_providers

          WHERE tmdb_id IS NOT NULL AND region IS NOT NULL AND provider_name IS NOT
          NULL

          '
      - type: deduplicate
        key:
        - tmdb_id
        - media_type
        - region
        - provider_name
        - availability_type
      quality:
        completeness: 0.9
        uniqueness:
        - tmdb_id
        - media_type
        - region
        - provider_name
        - availability_type
      destination: silver_watch_providers_by_region
      target:
        layer: silver
    silver_tv_entity_resolution:
      source: bronze_titles
      depends_on:
      - bronze_titles
      - bronze_tmdb_tv_details
      - bronze_tmdb_tv_ids
      transforms:
      - type: sql
        sql: "WITH matches AS (\n  SELECT\n    t.tconst,\n    d.id AS tmdb_id,\n \
          \   CASE\n      WHEN LOWER(TRIM(t.primaryTitle)) = LOWER(TRIM(d.name)) THEN\
          \ 1.0\n      ELSE 0.5\n    END AS match_confidence\n  FROM _data t\n  INNER\
          \ JOIN bronze_tmdb_tv_details d\n    ON t.tconst = d.external_ids.imdb_id\n\
          \  WHERE d.external_ids.imdb_id IS NOT NULL\n),\ntotals AS (\n  SELECT COUNT(*)\
          \ AS curated_count FROM bronze_tmdb_tv_ids\n)\nSELECT\n  matches.*,\n  CASE\n\
          \    WHEN totals.curated_count = 0 THEN 0.0\n    ELSE COUNT(*) OVER ()::DOUBLE\
          \ / totals.curated_count\n  END AS match_rate\nFROM matches\nCROSS JOIN\
          \ totals\n"
      quality:
