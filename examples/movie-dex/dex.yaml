      - runtime_norm
      - log_votes_norm
      - director_avg_rating
      - director_filmcount
      - g_action
      - g_drama
      - g_comedy
      - g_thriller
      - g_crime
      - g_romance
      - g_scifi
      - g_horror
      - g_adventure
      - g_animation
      - g_biography
      - g_documentary
      - g_fantasy
      - g_mystery
    - name: content_recommender
      model: content_recommender
      version: latest
