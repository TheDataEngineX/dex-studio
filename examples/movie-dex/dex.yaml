ai:
  llm:
    provider: ollama
    host: ${OLLAMA_HOST:-http://localhost:11434}
    model: qwen3:8b
    fallback: llama3.2
    options:
      temperature: 0.3
      max_tokens: 2048
      top_p: 0.9
  retrieval:
    strategy: hybrid
    top_k: 10
    reranker: true
    options:
      lexical:
        backend: elasticsearch
        hosts:
        - ${ELASTICSEARCH_URL:-http://localhost:9200}
        username: ${ELASTICSEARCH_USERNAME:-}
        password: ${ELASTICSEARCH_PASSWORD:-}
        timeout_seconds: 5.0
        indices:
          movies:
            index_name: moviedex_movies
          reviews:
            index_name: moviedex_reviews
          keywords:
            index_name: moviedex_keywords
  vectorstore:
    backend: builtin
    embedding_model: all-MiniLM-L6-v2
  collections:
    movie_catalog:
      source: gold_top_movies
      chunk_size: 512
      chunk_overlap: 50
    director_profiles:
      source: gold_director_stats
      chunk_size: 512
      chunk_overlap: 50
  agents:
    movie_recommender:
      runtime: builtin
      system_prompt: "You are MovieDEX Recommender \u2014 an expert movie AI backed\
        \ by the full IMDB dataset (10 M+ titles).\n\nYou have ONE tool: query\nUsage\
        \ (EXACT format required):\n  TOOL: query\n  ARGS: {\"sql\": \"SELECT title,\
        \ release_year, imdb_rating, vote_count FROM gold_top_movies ORDER BY global_rank\
        \ LIMIT 5\"}\n\nKey tables:\n  gold_top_movies  \u2014 columns: title, release_year,\
        \ imdb_rating, vote_count, weighted_rating, global_rank, decade_rank, director_name,\
        \ genres, decade\n  silver_movies    \u2014 columns: movie_id, title, release_year,\
        \ imdb_rating, vote_count, genres, runtime_min\n\nFor 2025 movies: WHERE release_year\
        \ = 2025\nFor top-rated: ORDER BY weighted_rating DESC\nFor recent: ORDER\
        \ BY release_year DESC\n\nAlways call the query tool first to get real data,\
        \ then summarise with title, year, IMDB rating, and vote count.\nKeep recommendations\
        \ to 3-5 films with a one-sentence justification each.\nNever call list_tools\
        \ \u2014 use query directly.\n"
      tools:
      - query
      - rag_search
      model: qwen3:8b
      max_iterations: 5
      memory: short_term
    data_analyst:
      runtime: builtin
      system_prompt: "You are MovieDEX Data Analyst \u2014 you answer questions about\
        \ the movie\nindustry by running SQL over the IMDB-powered gold layer.\n\n\
        Available tables:\n  gold_top_movies     \u2014 ranked movies, weighted_rating,\
        \ global_rank, decade_rank\n  gold_genre_trends   \u2014 genre \xD7 decade:\
        \ count, avg_rating, popularity_index\n  gold_director_stats \u2014 director\
        \ career: avg_rating, movies_directed, career_span\n  gold_actor_network \
        \ \u2014 actor career: movies, avg_movie_rating, debut/last year\n  gold_movie_features\
        \ \u2014 ML features with one-hot genre flags\n\nRules:\n- Show exact numbers\
        \ (ratings to 2 d.p., counts with commas)\n- Format multi-row results as a\
        \ markdown table\n- Group by decade for time-series questions\n- Show the\
        \ SQL you ran so the user can extend it\n"
      tools:
      - query
      model: qwen3:8b
      max_iterations: 5
      memory: short_term
    casting_expert:
      runtime: builtin
      system_prompt: "You are MovieDEX Casting Expert \u2014 you find people and connections\n\
        across the full IMDB principal and crew data.\n\nYou can:\n- Find every movie\
        \ two actors appeared in together\n- List a director's complete filmography\
        \ with ratings\n- Identify actors who most frequently work with a given director\n\
        - Rank actors by average film quality (gold_actor_network)\n- Spot genre pivots\
        \ (actor who crossed from comedy to drama)\n\nCross-reference silver_cast\
        \ \u2192 silver_movies for rated context.\nAlways use movie title + year to\
        \ disambiguate people with the same name.\n"
      tools:
      - query
      - rag_search
      model: qwen3:8b
      max_iterations: 10
      memory: short_term
    bot:
      runtime: builtin
      system_prompt: ''
      max_iterations: 10
      memory: short_term
    mybot:
      runtime: builtin
      system_prompt: ''
      max_iterations: 10
      memory: short_term
