      - type: sql
        sql: "-- \"watch/providers.results\" is a per-region map (dynamic country-code\n\
          -- keys), not a fixed-path LIST, so it can't use the plain `explode`\n--\
          \ transform (built for arrays like credits.cast). to_json + json_each\n\
          -- walks the region keys dynamically; a per-availability-type UNION\n--\
          \ unpacks the flatrate/rent/buy provider lists under each region.\nWITH\
          \ regions AS (\n  SELECT\n    _data.id                                 \
          \         AS tmdb_id,\n    je.key                                      \
          \       AS region,\n    je.value                                       \
          \    AS region_json\n  FROM _data,\n  LATERAL (SELECT * FROM json_each(to_json(\"\
          watch/providers\".results))) AS je\n  WHERE \"watch/providers\" IS NOT NULL\n\
          \    AND \"watch/providers\".results IS NOT NULL\n),\navailability AS (\n\
          \  SELECT tmdb_id, region, 'flatrate' AS availability_type,\n         unnest(json_transform(region_json\
          \ -> 'flatrate', '[\"JSON\"]')) AS p\n  FROM regions WHERE (region_json\
          \ -> 'flatrate') IS NOT NULL\n  UNION ALL\n  SELECT tmdb_id, region, 'rent'\
          \ AS availability_type,\n         unnest(json_transform(region_json -> 'rent',\
          \ '[\"JSON\"]')) AS p\n  FROM regions WHERE (region_json -> 'rent') IS NOT\
          \ NULL\n  UNION ALL\n  SELECT tmdb_id, region, 'buy' AS availability_type,\n\
          \         unnest(json_transform(region_json -> 'buy', '[\"JSON\"]')) AS\
          \ p\n  FROM regions WHERE (region_json -> 'buy') IS NOT NULL\n)\nSELECT\n\
          \  tmdb_id,\n  region,\n  json_extract_string(p, '$.provider_name') AS provider_name,\n\
          \  availability_type\nFROM availability\n"
