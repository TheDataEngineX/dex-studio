    silver_tmdb_review_similarity_pairs:
      source: bronze_tmdb_movie_details
      depends_on:
      - bronze_tmdb_movie_details
      transforms:
      - type: sql
        # Pre-existing bug fix: json_each() returns a (key, value, ...) row
        # set, not a single scalar — aliasing it as a 1-column rv(review_obj)
        # and dotting into review_obj.id/.content never worked (ParserException
        # on the misplaced "-> '$.results'", then a binder error once that was
        # fixed). Extract fields from rv.value with json_extract_string
        # instead, matching the je.key/je.value convention already used by
        # the watch_providers pipelines above.
        sql: |
          WITH reviews AS (
            SELECT
              d.id AS tmdb_id,
              json_extract_string(rv.value, '$.id') AS review_id,
              json_extract_string(rv.value, '$.content') AS content
            FROM _data d,
            LATERAL (SELECT * FROM json_each(to_json(d.reviews) -> '$.results')) AS rv
            WHERE json_extract_string(rv.value, '$.content') IS NOT NULL
              AND LENGTH(json_extract_string(rv.value, '$.content')) >= 40
          ),
          positive_pairs AS (
            SELECT
              a.content AS review_text_a,
              b.content AS review_text_b,
              1.0::DOUBLE AS similarity_label
            FROM reviews a
            INNER JOIN reviews b
              ON a.tmdb_id = b.tmdb_id AND a.review_id < b.review_id
          ),
          negative_pairs AS (
            SELECT
              a.content AS review_text_a,
              b.content AS review_text_b,
              0.0::DOUBLE AS similarity_label
            FROM reviews a
            INNER JOIN reviews b
              ON a.tmdb_id < b.tmdb_id
             AND ABS(HASH(a.review_id, b.review_id)) % 25 = 0
          )
          SELECT * FROM positive_pairs
          UNION ALL
          SELECT * FROM negative_pairs
      quality:
        completeness: 0.95
        custom_sql: SELECT COUNT(*) >= 10 FROM _data
      destination: silver_tmdb_review_similarity_pairs
      target:
        layer: silver
    silver_spark_tmdb_snapshot:
      source: spark_tmdb_gold
      depends_on:
      - gold_tmdb_enriched_movies
      transforms:
      - type: filter
        condition: tmdb_id IS NOT NULL
      quality:
        completeness: 0.9
        uniqueness:
        - tmdb_id
      destination: silver_spark_tmdb_snapshot
      target:
        layer: silver
ml:
  tracker: builtin
  tracking:
    backend: builtin
  features:
    backend: builtin
  experiments:
    rating_predictor:
      model_type: sklearn
      target: target_rating
      features:
      - year_norm
      - runtime_norm
      - log_votes_norm
      - director_avg_rating
      - director_filmcount
      - g_action
      - g_drama
      - g_comedy
      - g_thriller
      - g_crime
      - g_romance
      - g_scifi
      - g_horror
      - g_adventure
      - g_animation
      - g_biography
      - g_documentary
      - g_fantasy
      - g_mystery
      params:
        n_estimators: 300
        max_depth: 7
        min_samples_leaf: 20
        min_samples_split: 50
        random_state: 42
    content_recommender:
      model_type: sklearn
      target: target_rating
      features:
      - g_action
      - g_drama
      - g_comedy
      - g_thriller
      - g_crime
      - g_romance
      - g_scifi
      - g_horror
      - g_adventure
      - g_animation
      - g_fantasy
      - g_mystery
      - year_norm
      - director_avg_rating
      params:
        n_neighbors: 20
        metric: cosine
        algorithm: brute
    decade_classifier:
      model_type: sklearn
      target: decade
      features:
      - target_rating
      - log_votes_norm
      - g_action
      - g_drama
      - g_comedy
      - g_thriller
      - g_scifi
      - g_horror
      - g_romance
      - g_animation
      params:
        n_estimators: 200
        max_depth: 8
        random_state: 42
    review_similarity_finetune:
      model_type: sentence_transformer_finetune
      target: ''
      features: []
      params:
        base_model: all-MiniLM-L6-v2
        loss_type: contrastive
        dataset_table: silver_tmdb_review_similarity_pairs
        text_a_column: review_text_a
        text_b_column: review_text_b
        label_column: similarity_label
        epochs: 3
        batch_size: 16
        output_path: .dex/models/review_similarity/finetuned
  serving:
    engine: builtin
    endpoints:
