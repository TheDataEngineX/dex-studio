project:
  name: moviedex
  version: 1.0.0
  description: 'MovieDEX — end-to-end movie intelligence platform powered by the IMDB
    Non-Commercial Dataset (~10 M titles). Covers the full data engineering flow:
    ingest from IMDB TSV files → medallion lakehouse (bronze / silver / gold) → ML
    rating prediction + content-based recommendation → AI agents for movie discovery,
    trend analysis, and casting research.

    '
data:
  engine: duckdb
  sources:
    imdb_titles:
      type: http
      url: https://datasets.imdbws.com/title.basics.tsv.gz
      options:
        sep: "\t"
        null_str: \N
        max_age_hours: 20
    imdb_ratings:
      type: http
      url: https://datasets.imdbws.com/title.ratings.tsv.gz
      options:
        sep: "\t"
        null_str: \N
        max_age_hours: 20
    imdb_crew:
      type: http
      url: https://datasets.imdbws.com/title.crew.tsv.gz
      options:
        sep: "\t"
        null_str: \N
        max_age_hours: 20
    imdb_names:
      type: http
      url: https://datasets.imdbws.com/name.basics.tsv.gz
      options:
        sep: "\t"
        null_str: \N
        max_age_hours: 20
    imdb_principals:
      type: http
      url: https://datasets.imdbws.com/title.principals.tsv.gz
      options:
        sep: "\t"
        null_str: \N
        max_age_hours: 20
    wiki_movie_edits:
      type: sse
      url: https://stream.wikimedia.org/v2/stream/recentchange
      options:
        window_seconds: 60
        headers:
          User-Agent: MovieDEX/1.0 (dataenginex dex-studio; https://github.com/TheDataEngineX)
        filter:
          wiki: enwiki
          namespace: 0
          type: edit
    tmdb_trending:
      type: rest
      url: https://api.themoviedb.org/3/trending/movie/day
      connection:
        params:
          api_key: d95bfe26f45d90deb7cb59a8b8df8196
          language: en-US
      options:
        records_key: results
    tmdb_discover_movies:
      type: rest
      url: https://api.themoviedb.org/3/discover/movie
      connection:
        params:
          api_key: "YOUR_TMDB_API_KEY"
          language: en-US
          sort_by: popularity.desc
          vote_count.gte: 100
      options:
        records_key: results
        timeout: 30
        page_param: page
        max_pages: 250
    tmdb_movie_details:
      type: tmdb
      connection:
        api_key: "YOUR_TMDB_API_KEY"
        id_source_path: .dex/lakehouse/bronze/bronze_tmdb_movie_ids.parquet
        id_column: id
        media_type: movie
        max_concurrency: 10
        requests_per_second: 40.0
    tmdb_discover_tv:
      type: rest
      url: https://api.themoviedb.org/3/discover/tv
      connection:
        params:
          api_key: "YOUR_TMDB_API_KEY"
          language: en-US
          sort_by: popularity.desc
          vote_count.gte: 100
      options:
        records_key: results
        timeout: 30
        page_param: page
        max_pages: 100
    tmdb_tv_details:
      type: tmdb
      connection:
        api_key: "YOUR_TMDB_API_KEY"
        id_source_path: .dex/lakehouse/bronze/bronze_tmdb_tv_ids.parquet
        id_column: id
        media_type: tv
        max_concurrency: 10
        requests_per_second: 40.0
  pipelines:
    bronze_titles:
      source: imdb_titles
      transforms:
      - type: filter
        condition: tconst IS NOT NULL AND primaryTitle IS NOT NULL
      - type: fill_null
        defaults:
          originalTitle: ""
          startYear: "0"
          endYear: "0"
          runtimeMinutes: "0"
          genres: "Unknown"
      - type: derive
        expression: isAdult = '1'
        name: is_adult
      quality:
        completeness: 0.65
        custom_sql: SELECT COUNT(DISTINCT tconst) > 5000000 FROM _data
      destination: bronze_titles
      target:
        layer: bronze
      schedule: 0 3 * * *
    bronze_ratings:
      source: imdb_ratings
      transforms:
      - type: filter
        condition: tconst IS NOT NULL AND averageRating IS NOT NULL AND TRY_CAST(numVotes
          AS BIGINT) > 0
      - type: derive
        expression: "CASE\n  WHEN TRY_CAST(averageRating AS DOUBLE) >= 8.0 THEN 'excellent'\n\
          \  WHEN TRY_CAST(averageRating AS DOUBLE) >= 7.0 THEN 'great'\n  WHEN TRY_CAST(averageRating\
          \ AS DOUBLE) >= 5.0 THEN 'average'\n  ELSE 'poor'\nEND"
        name: rating_tier
      quality:
        completeness: 0.95
        uniqueness:
        - tconst
        custom_sql: SELECT AVG(TRY_CAST(averageRating AS DOUBLE)) BETWEEN 5.0 AND
          8.0 FROM _data
      destination: bronze_ratings
      target:
        layer: bronze
      schedule: 0 3 * * *
    bronze_crew:
      source: imdb_crew
      transforms:
      - type: filter
        condition: tconst IS NOT NULL
      - type: fill_null
        defaults:
          directors: ""
          writers: ""
      quality:
        completeness: 0.6
      destination: bronze_crew
      target:
        layer: bronze
      schedule: 0 3 * * *
    bronze_names:
      source: imdb_names
      transforms:
      - type: filter
        condition: nconst IS NOT NULL AND primaryName IS NOT NULL
      - type: deduplicate
        key:
        - nconst
      - type: fill_null
        defaults:
          birthYear: "0"
          deathYear: "0"
          primaryProfession: "Unknown"
          knownForTitles: ""
      quality:
        completeness: 0.6
        uniqueness:
        - nconst
      destination: bronze_names
      target:
        layer: bronze
      schedule: 0 3 * * *
    bronze_principals:
      source: imdb_principals
      transforms:
      - type: filter
        condition: tconst IS NOT NULL AND nconst IS NOT NULL
      - type: fill_null
        defaults:
          job: ""
          characters: ""
      quality:
        completeness: 0.55
      destination: bronze_principals
      target:
        layer: bronze
      schedule: 0 3 * * *
    bronze_wiki_edits:
      source: wiki_movie_edits
      transforms:
      - type: filter
        condition: title IS NOT NULL AND server_name = 'en.wikipedia.org'
      - type: fill_null
        defaults:
          comment: ""
          user: "anonymous"
          bot: "false"
      - type: derive
        expression: bot = true
        name: is_bot_edit
      quality:
        completeness: 0.5
        custom_sql: SELECT COUNT(*) >= 1 FROM _data
      destination: bronze_wiki_edits
      target:
        layer: bronze
      schedule: '*/15 * * * *'
    bronze_tmdb_trending:
      source: tmdb_trending
      transforms:
      - type: filter
        condition: id IS NOT NULL AND title IS NOT NULL
      - type: fill_null
        defaults:
          overview: ""
          poster_path: ""
          backdrop_path: ""
          release_date: ""
      - type: derive
        expression: "CASE\n  WHEN TRY_CAST(popularity AS DOUBLE) >= 1000 THEN 'viral'\n\
          \  WHEN TRY_CAST(popularity AS DOUBLE) >= 100  THEN 'trending'\n  WHEN TRY_CAST(popularity\
          \ AS DOUBLE) >= 10   THEN 'rising'\n  ELSE 'niche'\nEND"
        name: popularity_tier
      quality:
        completeness: 0.9
        uniqueness:
        - id
        custom_sql: SELECT COUNT(*) >= 10 FROM _data
      destination: bronze_tmdb_trending
      target:
        layer: bronze
      schedule: '*/30 * * * *'
    silver_movies:
      source: bronze_titles
      transforms:
      - type: sql
        sql: "SELECT\n  t.tconst                                         AS movie_id,\n\
          \  t.primaryTitle                                   AS title,\n  t.originalTitle\
          \                                  AS original_title,\n  TRY_CAST(t.startYear\
          \      AS INTEGER)           AS release_year,\n  TRY_CAST(t.runtimeMinutes\
          \ AS INTEGER)           AS runtime_min,\n  t.genres,\n  TRY_CAST(r.averageRating\
          \  AS DOUBLE)            AS imdb_rating,\n  TRY_CAST(r.numVotes       AS\
          \ BIGINT)            AS vote_count,\n  (TRY_CAST(t.startYear AS INTEGER)\
          \ / 10) * 10   AS decade\nFROM _data t\nLEFT JOIN bronze_ratings r ON t.tconst\
          \ = r.tconst\nWHERE\n  t.titleType = 'movie'\n  AND t.isAdult  = '0'\n \
          \ AND t.startYear IS NOT NULL\n  AND TRY_CAST(t.startYear AS INTEGER) BETWEEN\
          \ 1902 AND 2025\n"
      quality:
        completeness: 0.75
        uniqueness:
        - movie_id
      destination: silver_movies
      target:
        layer: silver
      depends_on:
      - bronze_titles
      - bronze_ratings
      schedule: 0 4 * * *
    silver_tv:
      source: bronze_titles
      transforms:
      - type: sql
        sql: "SELECT\n  t.tconst                                AS series_id,\n  t.primaryTitle\
          \                          AS title,\n  t.titleType                    \
          \         AS series_type,\n  TRY_CAST(t.startYear AS INTEGER)        AS\
          \ start_year,\n  TRY_CAST(t.endYear   AS INTEGER)        AS end_year,\n\
          \  t.genres,\n  TRY_CAST(r.averageRating AS DOUBLE)     AS imdb_rating,\n\
          \  TRY_CAST(r.numVotes      AS BIGINT)     AS vote_count\nFROM _data t\n\
          LEFT JOIN bronze_ratings r ON t.tconst = r.tconst\nWHERE\n  t.titleType\
          \ IN ('tvSeries', 'tvMiniSeries')\n  AND t.isAdult = '0'\n"
      quality:
        completeness: 0.7
        uniqueness:
        - series_id
      destination: silver_tv
      target:
        layer: silver
      depends_on:
      - bronze_titles
      - bronze_ratings
      schedule: 0 4 * * *
    silver_directors:
      source: bronze_crew
      transforms:
      - type: sql
        sql: "WITH expanded AS (\n  SELECT\n    c.tconst,\n    TRIM(d_id) AS director_id\n\
          \  FROM bronze_crew c\n  CROSS JOIN UNNEST(STRING_SPLIT(c.directors, ','))\
          \ AS t(d_id)\n  WHERE c.directors IS NOT NULL AND c.directors != '\\N'\n\
          )\nSELECT\n  e.tconst                            AS movie_id,\n  e.director_id,\n\
          \  n.primaryName                       AS director_name,\n  TRY_CAST(n.birthYear\
          \ AS INTEGER)    AS birth_year,\n  n.primaryProfession\nFROM expanded e\n\
          INNER JOIN silver_movies m ON e.tconst = m.movie_id\nLEFT JOIN  bronze_names\
          \  n ON e.director_id = n.nconst\nWHERE n.primaryName IS NOT NULL\n"
      quality:
        completeness: 0.75
      destination: silver_directors
      target:
        layer: silver
      depends_on:
      - bronze_crew
      - bronze_names
      - silver_movies
      schedule: 0 4 * * *
    silver_cast:
      source: bronze_principals
      transforms:
      - type: sql
        sql: "SELECT\n  p.tconst                            AS movie_id,\n  p.nconst\
          \                            AS person_id,\n  n.primaryName            \
          \           AS person_name,\n  p.category                          AS role,\n\
          \  TRY_CAST(p.ordering AS INTEGER)     AS billing_order\nFROM _data p\n\
          INNER JOIN silver_movies sm ON p.tconst = sm.movie_id\nLEFT JOIN  bronze_names\
          \  n  ON p.nconst = n.nconst\nWHERE p.category IN ('actor', 'actress')\n\
          \  AND TRY_CAST(p.ordering AS INTEGER) <= 5\n  AND n.primaryName IS NOT\
          \ NULL\n"
      quality:
        completeness: 0.85
      destination: silver_cast
      target:
        layer: silver
      depends_on:
      - bronze_principals
      - bronze_names
      - silver_movies
      schedule: 0 4 * * *
    silver_genres:
      source: silver_movies
      transforms:
      - type: sql
        sql: "SELECT\n  movie_id,\n  title,\n  TRIM(genre_val)  AS genre,\n  release_year,\n\
          \  decade,\n  imdb_rating,\n  vote_count\nFROM silver_movies\nCROSS JOIN\
          \ UNNEST(STRING_SPLIT(genres, ',')) AS t(genre_val)\nWHERE genres IS NOT\
          \ NULL\n  AND genres != '\\N'\n  AND TRIM(genre_val) != ''\n"
      quality:
        completeness: 0.8
      destination: silver_genres
      target:
        layer: silver
      depends_on:
      - silver_movies
      schedule: 0 4 * * *
    gold_top_movies:
      source: silver_movies
      transforms:
      - type: sql
        sql: "-- Bayesian weighted rating (IMDB Top-250 formula)\n-- WR = (v/(v+m))*R\
          \ + (m/(v+m))*C   (m=25000, C≈6.9)\nWITH scored AS (\n  SELECT\n    m.movie_id,\n\
          \    m.title,\n    m.original_title,\n    m.release_year,\n    m.runtime_min,\n\
          \    m.genres,\n    m.imdb_rating,\n    m.vote_count,\n    m.decade,\n \
          \   ROUND(\n      (m.vote_count / (m.vote_count + 25000.0)) * m.imdb_rating\n\
          \      + (25000.0   / (m.vote_count + 25000.0)) * 6.9, 4\n    )        \
          \                AS weighted_rating,\n    d.director_name,\n    d.director_id\n\
          \  FROM silver_movies m\n  LEFT JOIN (\n    SELECT movie_id, director_name,\
          \ director_id\n    FROM silver_directors\n    QUALIFY ROW_NUMBER() OVER\
          \ (PARTITION BY movie_id ORDER BY director_id) = 1\n  ) d ON m.movie_id\
          \ = d.movie_id\n  WHERE m.imdb_rating IS NOT NULL AND m.vote_count >= 1000\n\
          )\nSELECT\n  *,\n  RANK() OVER (ORDER BY weighted_rating DESC)         \
          \                   AS global_rank,\n  RANK() OVER (PARTITION BY decade\
          \ ORDER BY weighted_rating DESC)        AS decade_rank\nFROM scored\nORDER\
          \ BY global_rank\n"
      quality:
        completeness: 0.9
        custom_sql: SELECT COUNT(*) > 500 FROM _data
      destination: gold_top_movies
      target:
        layer: gold
      depends_on:
      - silver_movies
      - silver_directors
      schedule: 0 5 * * *
    gold_tmdb_enriched_movies:
      source: silver_movies
      transforms:
      - type: sql
        sql: "SELECT\n  m.movie_id,\n  m.title,\n  m.original_title,\n  m.release_year,\n\
          \  m.runtime_min,\n  m.genres,\n  m.imdb_rating,\n  m.vote_count,\n  m.decade,\n\
          \  d.tmdb_id,\n  d.match_confidence,\n  CAST(t.popularity AS DOUBLE)   \
          \ AS tmdb_popularity,\n  CAST(t.vote_average AS DOUBLE)    AS tmdb_vote_average,\n\
          \  t.overview\nFROM _data m\nINNER JOIN silver_entity_resolution d ON m.movie_id\
          \ = d.tconst\nLEFT JOIN bronze_tmdb_movie_details t ON d.tmdb_id = t.id\n\
          WHERE d.match_confidence >= 0.5\n"
      quality:
        completeness: 0.8
        uniqueness:
        - movie_id
      destination: gold_tmdb_enriched_movies
      target:
        layer: gold
      depends_on:
      - silver_movies
      - silver_entity_resolution
      - bronze_tmdb_movie_details
      schedule: 0 5 * * *
    gold_genre_trends:
      source: bronze_tmdb_movie_details
      transforms:
      - type: sql
        sql: "WITH genre_expanded AS (\n  SELECT\n    (CAST(SUBSTR(CAST(d.release_date\
          \ AS VARCHAR), 1, 4) AS INTEGER) / 10) * 10 AS decade,\n    json_extract_string(g,\
          \ '$.name') AS genre_name,\n    CAST(d.popularity AS DOUBLE) AS popularity,\n\
          \    CAST(d.vote_average AS DOUBLE) AS vote_average\n  FROM _data d,\n  LATERAL\
          \ (SELECT * FROM json_each(to_json(d.genres)) AS gen(g))\n  WHERE d.genres\
          \ IS NOT NULL\n)\nSELECT\n  genre_name,\n  decade,\n  COUNT(*) AS movie_count,\n\
          \  ROUND(AVG(vote_average), 3) AS avg_rating,\n  ROUND(AVG(popularity), 2)\
          \ AS avg_popularity,\n  MAX(vote_average) AS peak_rating,\n  MIN(vote_average)\
          \ AS floor_rating,\n  ROUND(\n    LN(SUM(popularity) + 1.0) * AVG(vote_average)\
          \ / 10.0, 4\n  ) AS popularity_index\nFROM genre_expanded\nWHERE genre_name\
          \ IS NOT NULL\n  AND decade IS NOT NULL\nGROUP BY genre_name, decade\nORDER\
          \ BY decade DESC, popularity_index DESC\n"
      quality:
        completeness: 0.95
      destination: gold_genre_trends
      target:
        layer: gold
      depends_on:
      - bronze_tmdb_movie_details
      schedule: 0 5 * * *
    gold_director_stats:
      source: silver_directors
      transforms:
      - type: sql
        sql: "SELECT\n  d.director_id,\n  d.director_name,\n  COUNT(DISTINCT d.movie_id)\
          \                    AS movies_directed,\n  ROUND(AVG(m.imdb_rating), 3)\
          \                  AS avg_rating,\n  ROUND(MAX(m.imdb_rating), 1)      \
          \            AS best_rating,\n  SUM(m.vote_count)                      \
          \       AS total_votes,\n  MIN(m.release_year)                         \
          \  AS career_start,\n  MAX(m.release_year)                           AS\
          \ latest_film,\n  MAX(m.release_year) - MIN(m.release_year)    AS career_span_years\n\
          FROM silver_directors d\nJOIN silver_movies m\n  ON d.movie_id = m.movie_id\n\
          \ AND m.imdb_rating IS NOT NULL\n AND m.vote_count  >= 500\nGROUP BY d.director_id,\
          \ d.director_name\nHAVING COUNT(DISTINCT d.movie_id) >= 2\nORDER BY avg_rating\
          \ DESC, total_votes DESC\n"
      quality:
        completeness: 0.9
      destination: gold_director_stats
      target:
        layer: gold
      depends_on:
      - silver_directors
      - silver_movies
      schedule: 0 5 * * *
    gold_actor_network:
      source: silver_cast
      transforms:
      - type: sql
        sql: "SELECT\n  c.person_id,\n  c.person_name,\n  COUNT(DISTINCT c.movie_id)\
          \                AS movies_appeared,\n  ROUND(AVG(m.imdb_rating), 3)   \
          \           AS avg_movie_rating,\n  SUM(m.vote_count)                  \
          \       AS total_audience_votes,\n  MIN(m.release_year)                \
          \       AS debut_year,\n  MAX(m.release_year)                       AS last_film_year\n\
          FROM silver_cast c\nJOIN silver_movies m\n  ON c.movie_id = m.movie_id\n\
          \ AND m.imdb_rating IS NOT NULL\n AND m.vote_count  >= 1000\nGROUP BY c.person_id,\
          \ c.person_name\nHAVING COUNT(DISTINCT c.movie_id) >= 3\nORDER BY avg_movie_rating\
          \ DESC, total_audience_votes DESC\n"
      quality:
        completeness: 0.9
      destination: gold_actor_network
      target:
        layer: gold
      depends_on:
      - silver_cast
      - silver_movies
      schedule: 0 5 * * *
    gold_movie_features:
      source: silver_movies
      transforms:
      - type: sql
        sql: "-- Feature table for ML: rating prediction + content-based recommendation\n\
          SELECT\n  m.movie_id,\n  m.title,\n  m.imdb_rating                     \
          \                     AS target_rating,\n  m.vote_count,\n  m.release_year,\n\
          \  m.runtime_min,\n  m.decade,\n  ROUND((m.release_year - 1900.0) / 125.0,\
          \ 4)           AS year_norm,\n  ROUND(COALESCE(m.runtime_min, 100) / 180.0,\
          \ 4)        AS runtime_norm,\n  ROUND(LN(m.vote_count + 1) / 16.0, 4)  \
          \               AS log_votes_norm,\n  ROUND(COALESCE(ds.avg_rating, 6.9),\
          \ 3)                AS director_avg_rating,\n  COALESCE(ds.movies_directed,\
          \ 1)                        AS director_filmcount,\n  (m.genres LIKE '%Action%')::INTEGER\
          \                    AS g_action,\n  (m.genres LIKE '%Drama%')::INTEGER\
          \                     AS g_drama,\n  (m.genres LIKE '%Comedy%')::INTEGER\
          \                    AS g_comedy,\n  (m.genres LIKE '%Thriller%')::INTEGER\
          \                  AS g_thriller,\n  (m.genres LIKE '%Crime%')::INTEGER\
          \                     AS g_crime,\n  (m.genres LIKE '%Romance%')::INTEGER\
          \                   AS g_romance,\n  (m.genres LIKE '%Sci-Fi%')::INTEGER\
          \                    AS g_scifi,\n  (m.genres LIKE '%Horror%')::INTEGER\
          \                    AS g_horror,\n  (m.genres LIKE '%Adventure%')::INTEGER\
          \                 AS g_adventure,\n  (m.genres LIKE '%Animation%')::INTEGER\
          \                 AS g_animation,\n  (m.genres LIKE '%Biography%')::INTEGER\
          \                 AS g_biography,\n  (m.genres LIKE '%Documentary%')::INTEGER\
          \               AS g_documentary,\n  (m.genres LIKE '%Fantasy%')::INTEGER\
          \                   AS g_fantasy,\n  (m.genres LIKE '%Mystery%')::INTEGER\
          \                   AS g_mystery\nFROM silver_movies m\nLEFT JOIN (\n  SELECT\
          \ movie_id, director_id\n  FROM silver_directors\n  QUALIFY ROW_NUMBER()\
          \ OVER (PARTITION BY movie_id ORDER BY director_id) = 1\n) sd ON m.movie_id\
          \ = sd.movie_id\nLEFT JOIN gold_director_stats ds ON sd.director_id = ds.director_id\n\
          WHERE\n  m.imdb_rating IS NOT NULL\n  AND m.vote_count   >= 100\n  AND m.release_year\
          \ IS NOT NULL\n"
      quality:
        completeness: 0.9
        custom_sql: SELECT COUNT(*) > 5000 FROM _data
      destination: gold_movie_features
      target:
        layer: gold
      depends_on:
      - silver_movies
      - silver_directors
      - gold_director_stats
      schedule: 0 5 * * *
    gold_watch_provider_coverage:
      source: silver_watch_providers_by_region
      transforms:
      - type: sql
        sql: "SELECT\n  region,\n  provider_name,\n  COUNT(DISTINCT tmdb_id)     \
          \     AS title_count,\n  COUNT(DISTINCT CONCAT(CAST(tmdb_id AS VARCHAR),\
          \ '-', availability_type)) AS total_availabilities\nFROM _data\nGROUP BY\
          \ region, provider_name\nORDER BY region, title_count DESC\n"
      quality:
        completeness: 0.85
      destination: gold_watch_provider_coverage
      target:
        layer: gold
      depends_on:
      - silver_watch_providers_by_region
      schedule: 0 5 * * *
    gold_cross_source_match_confidence:
      source: silver_entity_resolution
      transforms:
      - type: sql
        sql: "SELECT\n  tconst,\n  tmdb_id,\n  match_confidence,\n  CASE\n    WHEN\
          \ match_confidence >= 0.5 THEN 'HIGH'\n    WHEN match_confidence >= 0.3\
          \ THEN 'MEDIUM'\n    ELSE 'LOW'\n  END AS confidence_tier\nFROM _data\n"
      quality:
        completeness: 0.9
        custom_sql: SELECT AVG(match_confidence) >= 0.5 AND COUNT(*) >= 1000 FROM
          _data
      destination: gold_cross_source_match_confidence
      target:
        layer: gold
      depends_on:
      - silver_entity_resolution
      schedule: 0 5 * * *
    bronze_tmdb_movie_ids:
      source: tmdb_discover_movies
      transforms:
      - type: filter
        condition: id IS NOT NULL
      - type: deduplicate
        key:
        - id
      quality:
        completeness: 0.95
        uniqueness:
        - id
      destination: bronze_tmdb_movie_ids
      target:
        layer: bronze
      schedule: 0 2 * * *
    bronze_tmdb_movie_details:
      source: tmdb_movie_details
      depends_on:
      - bronze_tmdb_movie_ids
      transforms:
      - type: filter
        condition: id IS NOT NULL
      quality:
        completeness: 0.9
        uniqueness:
        - id
      destination: bronze_tmdb_movie_details
      target:
        layer: bronze
      schedule: 0 3 * * *
    bronze_tmdb_movie_credits:
      source: bronze_tmdb_movie_details
      depends_on:
      - bronze_tmdb_movie_details
      transforms:
      - type: explode
        options:
          column: credits.cast
          alias: credit
      quality:
        completeness: 0.8
      destination: bronze_tmdb_movie_credits
      target:
        layer: bronze
      schedule: 0 4 * * *
    bronze_tmdb_movie_watch_providers:
      source: bronze_tmdb_movie_details
      depends_on:
      - bronze_tmdb_movie_details
      transforms:
      - type: sql
        sql: |
          -- "watch/providers.results" is a per-region map (dynamic country-code
          -- keys), not a fixed-path LIST, so it can't use the plain `explode`
          -- transform (built for arrays like credits.cast). to_json + json_each
          -- walks the region keys dynamically; a per-availability-type UNION
          -- unpacks the flatrate/rent/buy provider lists under each region.
          WITH regions AS (
            SELECT
              _data.id                                          AS tmdb_id,
              je.key                                             AS region,
              je.value                                           AS region_json
            FROM _data,
            LATERAL (SELECT * FROM json_each(to_json("watch/providers".results))) AS je
            WHERE "watch/providers" IS NOT NULL
              AND "watch/providers".results IS NOT NULL
          ),
          availability AS (
            SELECT tmdb_id, region, 'flatrate' AS availability_type,
                   unnest(json_transform(region_json -> 'flatrate', '["JSON"]')) AS p
            FROM regions WHERE (region_json -> 'flatrate') IS NOT NULL
            UNION ALL
            SELECT tmdb_id, region, 'rent' AS availability_type,
                   unnest(json_transform(region_json -> 'rent', '["JSON"]')) AS p
            FROM regions WHERE (region_json -> 'rent') IS NOT NULL
            UNION ALL
            SELECT tmdb_id, region, 'buy' AS availability_type,
                   unnest(json_transform(region_json -> 'buy', '["JSON"]')) AS p
            FROM regions WHERE (region_json -> 'buy') IS NOT NULL
          )
          SELECT
            tmdb_id,
            region,
            json_extract_string(p, '$.provider_name') AS provider_name,
            availability_type
          FROM availability
      quality:
        completeness: 0.5
      destination: bronze_tmdb_movie_watch_providers
      target:
        layer: bronze
      schedule: 15 4 * * *
    bronze_tmdb_tv_ids:
      source: tmdb_discover_tv
      transforms:
      - type: filter
        condition: id IS NOT NULL
      - type: deduplicate
        key:
        - id
      quality:
        completeness: 0.95
        uniqueness:
        - id
      destination: bronze_tmdb_tv_ids
      target:
        layer: bronze
      schedule: 30 2 * * *
    bronze_tmdb_tv_details:
      source: tmdb_tv_details
      depends_on:
      - bronze_tmdb_tv_ids
      transforms:
      - type: filter
        condition: id IS NOT NULL
      quality:
        completeness: 0.9
        uniqueness:
        - id
      destination: bronze_tmdb_tv_details
      target:
        layer: bronze
      schedule: 30 3 * * *
    bronze_tmdb_tv_credits:
      source: bronze_tmdb_tv_details
      depends_on:
      - bronze_tmdb_tv_details
      transforms:
      - type: explode
        options:
          column: credits.cast
          alias: credit
      quality:
        completeness: 0.8
      destination: bronze_tmdb_tv_credits
      target:
        layer: bronze
      schedule: 30 4 * * *
    silver_entity_resolution:
      source: bronze_titles
      depends_on:
      - bronze_titles
      - bronze_tmdb_movie_details
      transforms:
      - type: sql
        sql: |
          SELECT
            t.tconst                                                  AS tconst,
            d.id                                                      AS tmdb_id,
            CASE
              WHEN LOWER(TRIM(t.primaryTitle)) = LOWER(TRIM(d.title)) THEN 1.0
              ELSE 0.5
            END                                                       AS match_confidence
          FROM _data t
          INNER JOIN bronze_tmdb_movie_details d ON t.tconst = d.imdb_id
          WHERE d.imdb_id IS NOT NULL
      quality:
        completeness: 0.9
        uniqueness:
        - tconst
        custom_sql: SELECT AVG(match_confidence) >= 0.5 FROM _data
      destination: silver_entity_resolution
      target:
        layer: silver
      schedule: 0 4 * * *
    silver_unified_cast_crew:
      source: bronze_principals
      depends_on:
      - bronze_principals
      - bronze_names
      - bronze_tmdb_movie_credits
      - silver_entity_resolution
      transforms:
      - type: sql
        sql: |
          -- Pragmatic union, not a fuzzy-name dedup: IMDB and TMDB cast rows
          -- are kept side by side (source column) rather than merged into one
          -- identity per person. Cross-source person matching (e.g. TMDB
          -- person id <-> IMDB nconst) is out of scope here — known
          -- limitation, revisit if a unified per-person view is needed.
          SELECT
            p.tconst                    AS resolved_title_id,
            n.primaryName                AS person_name,
            p.category                   AS role,
            'imdb'                       AS source
          FROM _data p
          LEFT JOIN bronze_names n ON p.nconst = n.nconst
          WHERE n.primaryName IS NOT NULL
          UNION ALL
          SELECT
            er.tconst                   AS resolved_title_id,
            c.credit.name                AS person_name,
            c.credit.character            AS role,
            'tmdb'                       AS source
          FROM bronze_tmdb_movie_credits c
          INNER JOIN silver_entity_resolution er ON c.id = er.tmdb_id
          WHERE c.credit.name IS NOT NULL
      quality:
        completeness: 0.7
      destination: silver_unified_cast_crew
      target:
        layer: silver
      schedule: 30 4 * * *
    silver_watch_providers_by_region:
      source: bronze_tmdb_movie_watch_providers
      depends_on:
      - bronze_tmdb_movie_watch_providers
      transforms:
      - type: filter
        condition: tmdb_id IS NOT NULL AND region IS NOT NULL AND provider_name IS
          NOT NULL
      - type: deduplicate
        key:
        - tmdb_id
        - region
        - provider_name
        - availability_type
      quality:
        completeness: 0.9
        uniqueness:
        - tmdb_id
        - region
        - provider_name
        - availability_type
      destination: silver_watch_providers_by_region
      target:
        layer: silver
      schedule: 45 4 * * *
ml:
  tracker: builtin
  tracking:
    backend: builtin
  features:
    backend: builtin
  experiments:
    rating_predictor:
      model_type: sklearn
      target: target_rating
      features:
      - year_norm
      - runtime_norm
      - log_votes_norm
      - director_avg_rating
      - director_filmcount
      - g_action
      - g_drama
      - g_comedy
      - g_thriller
      - g_crime
      - g_romance
      - g_scifi
      - g_horror
      - g_adventure
      - g_animation
      - g_biography
      - g_documentary
      - g_fantasy
      - g_mystery
      params:
        n_estimators: 300
        max_depth: 7
        min_samples_leaf: 20
