      input_schema:
      - g_action
      - g_drama
      - g_comedy
      - g_thriller
      - g_crime
      - g_romance
      - g_scifi
      - g_horror
      - g_adventure
      - g_animation
      - g_fantasy
      - g_mystery
      - year_norm
      - director_avg_rating
    - name: decade_classifier
      model: decade_classifier
