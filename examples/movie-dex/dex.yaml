project:
  name: moviedex
  version: 1.0.0
  description: "MovieDEX \u2014 end-to-end movie intelligence platform powered by\
    \ the IMDB Non-Commercial Dataset (~10 M titles). Covers the full data engineering\
    \ flow: ingest from IMDB TSV files \u2192 medallion lakehouse (bronze / silver\
    \ / gold) \u2192 ML rating prediction + content-based recommendation \u2192 AI\
    \ agents for movie discovery, trend analysis, and casting research.\n"
scheduler:
  enabled: true
  timezone: UTC
  max_concurrent_pipelines: 1
  min_free_mb: 3072
  retry:
    max_attempts: 3
    backoff_seconds: 120
  on_pipeline_complete:
    gold_top_movies:
      trigger_ml_retrain: true
      ml_experiment: rating_predictor
      trigger_ai_index_refresh: true
    gold_tmdb_enriched_movies:
      trigger_ml_retrain: true
      ml_experiment: content_recommender
      trigger_ai_index_refresh: true
    gold_movie_features:
      trigger_ml_retrain: true
      ml_experiment: rating_predictor
    silver_entity_resolution:
      trigger_ai_index_refresh: true
data:
  engine: duckdb
  sources:
    imdb_titles:
      type: http
      url: https://datasets.imdbws.com/title.basics.tsv.gz
      options:
        sep: "\t"
        null_str: \N
        max_age_hours: 20
    imdb_ratings:
      type: http
      url: https://datasets.imdbws.com/title.ratings.tsv.gz
      options:
        sep: "\t"
        null_str: \N
        max_age_hours: 20
    imdb_crew:
      type: http
      url: https://datasets.imdbws.com/title.crew.tsv.gz
      options:
        sep: "\t"
        null_str: \N
        max_age_hours: 20
    imdb_names:
      type: http
      url: https://datasets.imdbws.com/name.basics.tsv.gz
      options:
        sep: "\t"
        null_str: \N
        max_age_hours: 20
    imdb_principals:
      type: http
      url: https://datasets.imdbws.com/title.principals.tsv.gz
      options:
        sep: "\t"
        null_str: \N
        max_age_hours: 20
    wiki_movie_edits:
      type: sse
      url: https://stream.wikimedia.org/v2/stream/recentchange
      options:
        window_seconds: 60
        headers:
          User-Agent: MovieDEX/1.0 (dataenginex dex-studio; https://github.com/TheDataEngineX)
        filter:
          wiki: enwiki
          namespace: 0
          type: edit
    tmdb_trending:
      type: rest
      url: https://api.themoviedb.org/3/trending/movie/day
      connection:
        params:
          api_key: ${TMDB_API_KEY:-}
          language: en-US
      options:
        records_key: results
    tmdb_discover_movies:
      type: rest
      url: https://api.themoviedb.org/3/discover/movie
      connection:
        params:
          api_key: ${TMDB_API_KEY:-}
          language: en-US
          sort_by: popularity.desc
          vote_count.gte: 100
      options:
        records_key: results
        timeout: 30
        page_param: page
        max_pages: 250
    tmdb_movie_details:
      type: tmdb
      connection:
        api_key: ${TMDB_API_KEY:-}
        id_source_path: .dex/lakehouse/bronze/bronze_tmdb_movie_ids
        id_column: id
        media_type: movie
        max_concurrency: 10
        requests_per_second: 40.0
        redis_url: ${REDIS_URL:-}
        redis_password: ${REDIS_PASSWORD:-}
        since_source_path: .dex/lakehouse/bronze/bronze_tmdb_movie_changes
        since_column: id
    tmdb_discover_tv:
      type: rest
      url: https://api.themoviedb.org/3/discover/tv
      connection:
        params:
          api_key: ${TMDB_API_KEY:-}
          language: en-US
          sort_by: popularity.desc
          vote_count.gte: 100
      options:
        records_key: results
        timeout: 30
        page_param: page
        max_pages: 100
    tmdb_tv_details:
      type: tmdb
      connection:
        api_key: ${TMDB_API_KEY:-}
        id_source_path: .dex/lakehouse/bronze/bronze_tmdb_tv_ids
        id_column: id
        media_type: tv
        max_concurrency: 10
        requests_per_second: 40.0
        redis_url: ${REDIS_URL:-}
        redis_password: ${REDIS_PASSWORD:-}
    spark_tmdb_gold:
      type: spark
      connection:
        master: local[*]
        app_name: moviedex-gold-validation
        format: parquet
        path: .dex/lakehouse/gold/gold_tmdb_enriched_movies.parquet
    tmdb_movie_changes_api:
      type: rest
      url: https://api.themoviedb.org/3/movie/changes
      connection:
        params:
          api_key: ${TMDB_API_KEY:-}
      options:
        records_key: results
        timeout: 30
        page_param: page
        max_pages: 10
    kafka_tmdb_changes_producer:
      type: kafka
      connection:
        bootstrap_servers: ${KAFKA_BOOTSTRAP_SERVERS:-localhost:9092}
        topic: moviedex.tmdb.movie-changes.v1
        mode: produce
        security_protocol: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
        username: ${KAFKA_USERNAME:-}
        password: ${KAFKA_PASSWORD:-}
        timeout_seconds: 3
        spool_path: .dex/spool/kafka-tmdb-changes.jsonl
    kafka_tmdb_changes_consumer:
      type: kafka
      connection:
        bootstrap_servers: ${KAFKA_BOOTSTRAP_SERVERS:-localhost:9092}
        topic: moviedex.tmdb.movie-changes.v1
        mode: consume
        group_id: moviedex-lakehouse
        security_protocol: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
        username: ${KAFKA_USERNAME:-}
        password: ${KAFKA_PASSWORD:-}
        # Each pipeline run is a fresh consumer instance joining the group —
        # group-join/partition-assignment alone can take several seconds, so
        # this needs real headroom beyond the producer's 3s (no coordination
        # needed there). 3s here silently returned 0 records every time.
        timeout_seconds: 20
    kafka_wiki_edits_producer:
      type: kafka
      connection:
        bootstrap_servers: ${KAFKA_BOOTSTRAP_SERVERS:-localhost:9092}
        topic: moviedex.wikipedia.movie-edits.v1
        mode: produce
        security_protocol: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
        username: ${KAFKA_USERNAME:-}
        password: ${KAFKA_PASSWORD:-}
        timeout_seconds: 3
        spool_path: .dex/spool/kafka-wiki-edits.jsonl
    kafka_wiki_edits_consumer:
      type: kafka
      connection:
        bootstrap_servers: ${KAFKA_BOOTSTRAP_SERVERS:-localhost:9092}
        topic: moviedex.wikipedia.movie-edits.v1
        mode: consume
        group_id: moviedex-lakehouse
        security_protocol: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
        username: ${KAFKA_USERNAME:-}
        password: ${KAFKA_PASSWORD:-}
        # Same reasoning as kafka_tmdb_changes_consumer above: group-join on a
        # fresh consumer instance needs real headroom, not the producer's 3s.
        timeout_seconds: 20
  pipelines:
    bronze_titles:
      source: imdb_titles
      transforms:
      - type: filter
        condition: tconst IS NOT NULL AND primaryTitle IS NOT NULL
      - type: fill_null
        defaults:
          originalTitle: ''
          startYear: '0'
          endYear: '0'
          runtimeMinutes: '0'
          genres: Unknown
      - type: derive
        expression: isAdult = '1'
        name: is_adult
      quality:
        completeness: 0.65
        custom_sql: SELECT COUNT(DISTINCT tconst) > 5000000 FROM _data
      destination: bronze_titles
      target:
        layer: bronze
        format: delta
      schedule: 0 3 * * *
    bronze_ratings:
      source: imdb_ratings
      transforms:
      - type: filter
        condition: tconst IS NOT NULL AND averageRating IS NOT NULL AND TRY_CAST(numVotes
          AS BIGINT) > 0
      - type: derive
        expression: "CASE\n  WHEN TRY_CAST(averageRating AS DOUBLE) >= 8.0 THEN 'excellent'\n\
          \  WHEN TRY_CAST(averageRating AS DOUBLE) >= 7.0 THEN 'great'\n  WHEN TRY_CAST(averageRating\
          \ AS DOUBLE) >= 5.0 THEN 'average'\n  ELSE 'poor'\nEND"
        name: rating_tier
      quality:
        completeness: 0.95
        uniqueness:
        - tconst
        custom_sql: SELECT AVG(TRY_CAST(averageRating AS DOUBLE)) BETWEEN 5.0 AND
          8.0 FROM _data
      destination: bronze_ratings
      target:
        layer: bronze
        format: delta
        scd_type: '2'
      schedule: 0 3 * * *
    bronze_crew:
      source: imdb_crew
      transforms:
      - type: filter
        condition: tconst IS NOT NULL
      - type: fill_null
        defaults:
          directors: ''
          writers: ''
      quality:
        completeness: 0.6
      destination: bronze_crew
      target:
        layer: bronze
        format: delta
      schedule: 0 3 * * *
    bronze_names:
      source: imdb_names
      transforms:
      - type: filter
        condition: nconst IS NOT NULL AND primaryName IS NOT NULL
      - type: deduplicate
        key:
        - nconst
      - type: fill_null
        defaults:
          birthYear: '0'
          deathYear: '0'
          primaryProfession: Unknown
          knownForTitles: ''
      quality:
        completeness: 0.6
        uniqueness:
        - nconst
      destination: bronze_names
      target:
        layer: bronze
        format: delta
      schedule: 0 3 * * *
    bronze_principals:
      source: imdb_principals
      transforms:
      - type: filter
        condition: tconst IS NOT NULL AND nconst IS NOT NULL
      - type: fill_null
        defaults:
          job: ''
          characters: ''
      quality:
        completeness: 0.55
      destination: bronze_principals
      target:
        layer: bronze
        format: delta
      schedule: 0 3 * * *
    bronze_wiki_edits:
      source: wiki_movie_edits
      transforms:
      - type: filter
        condition: title IS NOT NULL AND server_name = 'en.wikipedia.org'
      - type: fill_null
        defaults:
          comment: ''
          user: anonymous
          bot: 'false'
      - type: derive
        expression: bot = true
        name: is_bot_edit
      quality:
        completeness: 0.5
        custom_sql: SELECT COUNT(*) >= 1 FROM _data
      destination: bronze_wiki_edits
      publish_to:
      - kafka_wiki_edits_producer
      target:
        layer: bronze
        format: delta
      schedule: '*/15 * * * *'
    bronze_wiki_edits_stream:
      source: kafka_wiki_edits_consumer
      transforms:
      - type: deduplicate
        key:
        - id
      quality:
        completeness: 0.8
      destination: bronze_wiki_edits_stream
      target:
        layer: bronze
        format: delta
      schedule: '*/5 * * * *'
    bronze_tmdb_trending:
      source: tmdb_trending
      transforms:
      - type: filter
        condition: id IS NOT NULL AND title IS NOT NULL
      - type: fill_null
        defaults:
          overview: ''
          poster_path: ''
          backdrop_path: ''
          release_date: ''
      - type: derive
        expression: "CASE\n  WHEN TRY_CAST(popularity AS DOUBLE) >= 1000 THEN 'viral'\n\
          \  WHEN TRY_CAST(popularity AS DOUBLE) >= 100  THEN 'trending'\n  WHEN TRY_CAST(popularity\
          \ AS DOUBLE) >= 10   THEN 'rising'\n  ELSE 'niche'\nEND"
        name: popularity_tier
      quality:
        completeness: 0.9
        uniqueness:
        - id
        custom_sql: SELECT COUNT(*) >= 10 FROM _data
      destination: bronze_tmdb_trending
      target:
        layer: bronze
        format: delta
      schedule: '*/30 * * * *'
    silver_movies:
      source: bronze_titles
      transforms:
      - type: sql
        sql: |
          SELECT
            t.tconst                                         AS movie_id,
            t.primaryTitle                                   AS title,
            t.originalTitle                                  AS original_title,
            TRY_CAST(t.startYear      AS INTEGER)           AS release_year,
            TRY_CAST(t.runtimeMinutes AS INTEGER)           AS runtime_min,
            t.genres,
            TRY_CAST(r.averageRating  AS DOUBLE)            AS imdb_rating,
            TRY_CAST(r.numVotes       AS BIGINT)            AS vote_count,
            (TRY_CAST(t.startYear AS INTEGER) / 10) * 10   AS decade
          FROM _data t
          LEFT JOIN bronze_ratings r
            ON t.tconst = r.tconst AND r._dex_is_current
          WHERE
            t.titleType = 'movie'
            AND t.isAdult  = '0'
            AND t.startYear IS NOT NULL
            AND TRY_CAST(t.startYear AS INTEGER) BETWEEN 1902 AND 2025
      quality:
        completeness: 0.75
        uniqueness:
        - movie_id
      destination: silver_movies
      target:
        layer: silver
      depends_on:
      - bronze_titles
      - bronze_ratings
    silver_tv:
      source: bronze_titles
      transforms:
      - type: sql
        sql: |
          SELECT
            t.tconst                                AS series_id,
            t.primaryTitle                           AS title,
            t.titleType                              AS series_type,
            TRY_CAST(t.startYear AS INTEGER)        AS start_year,
            TRY_CAST(t.endYear   AS INTEGER)        AS end_year,
            t.genres,
            TRY_CAST(r.averageRating AS DOUBLE)     AS imdb_rating,
            TRY_CAST(r.numVotes      AS BIGINT)     AS vote_count
          FROM _data t
          LEFT JOIN bronze_ratings r
            ON t.tconst = r.tconst AND r._dex_is_current
          WHERE
            t.titleType IN ('tvSeries', 'tvMiniSeries')
            AND t.isAdult = '0'
      quality:
        completeness: 0.7
        uniqueness:
        - series_id
      destination: silver_tv
      target:
        layer: silver
      depends_on:
      - bronze_titles
      - bronze_ratings
    silver_directors:
      source: bronze_crew
      transforms:
      - type: sql
        sql: "WITH expanded AS (\n  SELECT\n    c.tconst,\n    TRIM(d_id) AS director_id\n\
          \  FROM bronze_crew c\n  CROSS JOIN UNNEST(STRING_SPLIT(c.directors, ','))\
          \ AS t(d_id)\n  WHERE c.directors IS NOT NULL AND c.directors != '\\N'\n\
          )\nSELECT\n  e.tconst                            AS movie_id,\n  e.director_id,\n\
          \  n.primaryName                       AS director_name,\n  TRY_CAST(n.birthYear\
          \ AS INTEGER)    AS birth_year,\n  n.primaryProfession\nFROM expanded e\n\
          INNER JOIN silver_movies m ON e.tconst = m.movie_id\nLEFT JOIN  bronze_names\
          \  n ON e.director_id = n.nconst\nWHERE n.primaryName IS NOT NULL\n"
      quality:
        completeness: 0.75
      destination: silver_directors
      target:
        layer: silver
      depends_on:
      - bronze_crew
      - bronze_names
      - silver_movies
    silver_cast:
      source: bronze_principals
      transforms:
      - type: sql
        sql: "SELECT\n  p.tconst                            AS movie_id,\n  p.nconst\
          \                            AS person_id,\n  n.primaryName            \
          \           AS person_name,\n  p.category                          AS role,\n\
          \  TRY_CAST(p.ordering AS INTEGER)     AS billing_order\nFROM _data p\n\
          INNER JOIN silver_movies sm ON p.tconst = sm.movie_id\nLEFT JOIN  bronze_names\
          \  n  ON p.nconst = n.nconst\nWHERE p.category IN ('actor', 'actress')\n\
          \  AND TRY_CAST(p.ordering AS INTEGER) <= 5\n  AND n.primaryName IS NOT\
          \ NULL\n"
      quality:
        completeness: 0.85
      destination: silver_cast
      target:
        layer: silver
      depends_on:
      - bronze_principals
      - bronze_names
      - silver_movies
    silver_genres:
      source: silver_movies
      transforms:
      - type: sql
        sql: "SELECT\n  movie_id,\n  title,\n  TRIM(genre_val)  AS genre,\n  release_year,\n\
          \  decade,\n  imdb_rating,\n  vote_count\nFROM silver_movies\nCROSS JOIN\
          \ UNNEST(STRING_SPLIT(genres, ',')) AS t(genre_val)\nWHERE genres IS NOT\
          \ NULL\n  AND genres != '\\N'\n  AND TRIM(genre_val) != ''\n"
      quality:
        completeness: 0.8
      destination: silver_genres
      target:
        layer: silver
      depends_on:
      - silver_movies
    gold_top_movies:
      source: silver_movies
      transforms:
      - type: sql
        sql: "-- Bayesian weighted rating (IMDB Top-250 formula)\n-- WR = (v/(v+m))*R\
          \ + (m/(v+m))*C   (m=25000, C\u22486.9)\nWITH scored AS (\n  SELECT\n  \
          \  m.movie_id,\n    m.title,\n    m.original_title,\n    m.release_year,\n\
          \    m.runtime_min,\n    m.genres,\n    m.imdb_rating,\n    m.vote_count,\n\
          \    m.decade,\n    ROUND(\n      (m.vote_count / (m.vote_count + 25000.0))\
          \ * m.imdb_rating\n      + (25000.0   / (m.vote_count + 25000.0)) * 6.9,\
          \ 4\n    )                        AS weighted_rating,\n    d.director_name,\n\
          \    d.director_id\n  FROM silver_movies m\n  LEFT JOIN (\n    SELECT movie_id,\
          \ director_name, director_id\n    FROM silver_directors\n    QUALIFY ROW_NUMBER()\
          \ OVER (PARTITION BY movie_id ORDER BY director_id) = 1\n  ) d ON m.movie_id\
          \ = d.movie_id\n  WHERE m.imdb_rating IS NOT NULL AND m.vote_count >= 1000\n\
          )\nSELECT\n  *,\n  RANK() OVER (ORDER BY weighted_rating DESC)         \
          \                   AS global_rank,\n  RANK() OVER (PARTITION BY decade\
          \ ORDER BY weighted_rating DESC)        AS decade_rank\nFROM scored\nORDER\
          \ BY global_rank\n"
      quality:
        completeness: 0.9
        custom_sql: SELECT COUNT(*) > 500 FROM _data
      destination: gold_top_movies
      target:
        layer: gold
      depends_on:
      - silver_movies
      - silver_directors
    gold_tmdb_enriched_movies:
      source: silver_movies
      transforms:
      - type: sql
        sql: "SELECT\n  m.movie_id,\n  m.title,\n  m.original_title,\n  m.release_year,\n\
          \  m.runtime_min,\n  m.genres,\n  m.imdb_rating,\n  m.vote_count,\n  m.decade,\n\
          \  d.tmdb_id,\n  d.match_confidence,\n  CAST(t.popularity AS DOUBLE)   \
          \ AS tmdb_popularity,\n  CAST(t.vote_average AS DOUBLE)    AS tmdb_vote_average,\n\
          \  t.overview\nFROM _data m\nINNER JOIN silver_entity_resolution d ON m.movie_id\
          \ = d.tconst\nLEFT JOIN bronze_tmdb_movie_details t ON d.tmdb_id = t.id\n\
          WHERE d.match_confidence >= 0.5\n"
      quality:
        completeness: 0.8
        uniqueness:
        - movie_id
      destination: gold_tmdb_enriched_movies
      target:
        layer: gold
      depends_on:
      - silver_movies
      - silver_entity_resolution
      - bronze_tmdb_movie_details
    gold_genre_trends:
      source: bronze_tmdb_movie_details
      on_failure: skip
      transforms:
      - type: sql
        sql: "WITH genre_expanded AS (\n  SELECT\n    (CAST(SUBSTR(CAST(d.release_date\
          \ AS VARCHAR), 1, 4) AS INTEGER) / 10) * 10 AS decade,\n    json_extract_string(g,\
          \ '$.name') AS genre_name,\n    CAST(d.popularity AS DOUBLE) AS popularity,\n\
          \    CAST(d.vote_average AS DOUBLE) AS vote_average\n  FROM _data d,\n \
          \ LATERAL (SELECT * FROM json_each(to_json(d.genres)) AS gen(g))\n  WHERE\
          \ d.genres IS NOT NULL\n)\nSELECT\n  genre_name,\n  decade,\n  COUNT(*)\
          \ AS movie_count,\n  ROUND(AVG(vote_average), 3) AS avg_rating,\n  ROUND(AVG(popularity),\
          \ 2) AS avg_popularity,\n  MAX(vote_average) AS peak_rating,\n  MIN(vote_average)\
          \ AS floor_rating,\n  ROUND(\n    LN(SUM(popularity) + 1.0) * AVG(vote_average)\
          \ / 10.0, 4\n  ) AS popularity_index\nFROM genre_expanded\nWHERE genre_name\
          \ IS NOT NULL\n  AND decade IS NOT NULL\nGROUP BY genre_name, decade\nORDER\
          \ BY decade DESC, popularity_index DESC\n"
      quality:
        completeness: 0.95
      destination: gold_genre_trends
      target:
        layer: gold
      depends_on:
      - bronze_tmdb_movie_details
    gold_director_stats:
      source: silver_directors
      transforms:
      - type: sql
        sql: "SELECT\n  d.director_id,\n  d.director_name,\n  COUNT(DISTINCT d.movie_id)\
          \                    AS movies_directed,\n  ROUND(AVG(m.imdb_rating), 3)\
          \                  AS avg_rating,\n  ROUND(MAX(m.imdb_rating), 1)      \
          \            AS best_rating,\n  SUM(m.vote_count)                      \
          \       AS total_votes,\n  MIN(m.release_year)                         \
          \  AS career_start,\n  MAX(m.release_year)                           AS\
          \ latest_film,\n  MAX(m.release_year) - MIN(m.release_year)    AS career_span_years\n\
          FROM silver_directors d\nJOIN silver_movies m\n  ON d.movie_id = m.movie_id\n\
          \ AND m.imdb_rating IS NOT NULL\n AND m.vote_count  >= 500\nGROUP BY d.director_id,\
          \ d.director_name\nHAVING COUNT(DISTINCT d.movie_id) >= 2\nORDER BY avg_rating\
          \ DESC, total_votes DESC\n"
      quality:
        completeness: 0.9
      destination: gold_director_stats
      target:
        layer: gold
      depends_on:
      - silver_directors
      - silver_movies
    gold_actor_network:
      source: silver_cast
      transforms:
      - type: sql
        sql: "SELECT\n  c.person_id,\n  c.person_name,\n  COUNT(DISTINCT c.movie_id)\
          \                AS movies_appeared,\n  ROUND(AVG(m.imdb_rating), 3)   \
          \           AS avg_movie_rating,\n  SUM(m.vote_count)                  \
          \       AS total_audience_votes,\n  MIN(m.release_year)                \
          \       AS debut_year,\n  MAX(m.release_year)                       AS last_film_year\n\
          FROM silver_cast c\nJOIN silver_movies m\n  ON c.movie_id = m.movie_id\n\
          \ AND m.imdb_rating IS NOT NULL\n AND m.vote_count  >= 1000\nGROUP BY c.person_id,\
          \ c.person_name\nHAVING COUNT(DISTINCT c.movie_id) >= 3\nORDER BY avg_movie_rating\
          \ DESC, total_audience_votes DESC\n"
      quality:
        completeness: 0.9
      destination: gold_actor_network
      target:
        layer: gold
      depends_on:
      - silver_cast
      - silver_movies
    gold_movie_features:
      source: silver_movies
      transforms:
      - type: sql
        sql: "-- Feature table for ML: rating prediction + content-based recommendation\n\
          SELECT\n  m.movie_id,\n  m.title,\n  m.imdb_rating                     \
          \                     AS target_rating,\n  m.vote_count,\n  m.release_year,\n\
          \  m.runtime_min,\n  m.decade,\n  ROUND((m.release_year - 1900.0) / 125.0,\
          \ 4)           AS year_norm,\n  ROUND(COALESCE(m.runtime_min, 100) / 180.0,\
          \ 4)        AS runtime_norm,\n  ROUND(LN(m.vote_count + 1) / 16.0, 4)  \
          \               AS log_votes_norm,\n  ROUND(COALESCE(ds.avg_rating, 6.9),\
          \ 3)                AS director_avg_rating,\n  COALESCE(ds.movies_directed,\
          \ 1)                        AS director_filmcount,\n  (m.genres LIKE '%Action%')::INTEGER\
          \                    AS g_action,\n  (m.genres LIKE '%Drama%')::INTEGER\
          \                     AS g_drama,\n  (m.genres LIKE '%Comedy%')::INTEGER\
          \                    AS g_comedy,\n  (m.genres LIKE '%Thriller%')::INTEGER\
          \                  AS g_thriller,\n  (m.genres LIKE '%Crime%')::INTEGER\
          \                     AS g_crime,\n  (m.genres LIKE '%Romance%')::INTEGER\
          \                   AS g_romance,\n  (m.genres LIKE '%Sci-Fi%')::INTEGER\
          \                    AS g_scifi,\n  (m.genres LIKE '%Horror%')::INTEGER\
          \                    AS g_horror,\n  (m.genres LIKE '%Adventure%')::INTEGER\
          \                 AS g_adventure,\n  (m.genres LIKE '%Animation%')::INTEGER\
          \                 AS g_animation,\n  (m.genres LIKE '%Biography%')::INTEGER\
          \                 AS g_biography,\n  (m.genres LIKE '%Documentary%')::INTEGER\
          \               AS g_documentary,\n  (m.genres LIKE '%Fantasy%')::INTEGER\
          \                   AS g_fantasy,\n  (m.genres LIKE '%Mystery%')::INTEGER\
          \                   AS g_mystery\nFROM silver_movies m\nLEFT JOIN (\n  SELECT\
          \ movie_id, director_id\n  FROM silver_directors\n  QUALIFY ROW_NUMBER()\
          \ OVER (PARTITION BY movie_id ORDER BY director_id) = 1\n) sd ON m.movie_id\
          \ = sd.movie_id\nLEFT JOIN gold_director_stats ds ON sd.director_id = ds.director_id\n\
          WHERE\n  m.imdb_rating IS NOT NULL\n  AND m.vote_count   >= 100\n  AND m.release_year\
          \ IS NOT NULL\n"
      quality:
        completeness: 0.9
        custom_sql: SELECT COUNT(*) > 5000 FROM _data
      destination: gold_movie_features
      target:
        layer: gold
      depends_on:
      - silver_movies
      - silver_directors
      - gold_director_stats
    gold_watch_provider_coverage:
