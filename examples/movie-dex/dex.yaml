      - type: sql
        sql: "WITH keyword_expanded AS (\n  SELECT\n    (CAST(SUBSTR(CAST(d.release_date\
          \ AS VARCHAR), 1, 4) AS INTEGER) / 10) * 10 AS decade,\n    json_extract_string(kw,\
          \ '$.name') AS keyword_name,\n    CAST(d.popularity AS DOUBLE) AS popularity\n\
          \  FROM _data d,\n  LATERAL (SELECT * FROM json_each(to_json(d.keywords))\
          \ -> '$.keywords') AS kw(keyword)\n  WHERE d.keywords IS NOT NULL\n    AND\
          \ d.release_date IS NOT NULL\n)\nSELECT\n  keyword_name,\n  decade,\n  COUNT(*)\
          \ AS title_count,\n  ROUND(AVG(popularity), 3) AS avg_popularity\nFROM keyword_expanded\n\
          WHERE keyword_name IS NOT NULL\nGROUP BY keyword_name, decade\nORDER BY title_count\
          \ DESC, avg_popularity DESC\n"
