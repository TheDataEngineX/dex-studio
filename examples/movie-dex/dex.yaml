        random_state: 42
    content_recommender:
      model_type: sklearn
      target: target_rating
      features:
      - g_action
      - g_drama
      - g_comedy
      - g_thriller
      - g_crime
      - g_romance
      - g_scifi
      - g_horror
      - g_adventure
      - g_animation
      - g_fantasy
      - g_mystery
      - year_norm
      - director_avg_rating
      params:
        n_neighbors: 20
        metric: cosine
        algorithm: brute
    decade_classifier:
      model_type: sklearn
      target: decade
      features:
      - target_rating
      - log_votes_norm
      - g_action
      - g_drama
      - g_comedy
      - g_thriller
      - g_scifi
      - g_horror
