      - silver_tv_entity_resolution
      transforms:
      - type: sql
        sql: "SELECT\n  er.tconst AS resolved_title_id,\n  cast_member.name AS person_name,\n\
          \  cast_member.character AS role,\n  'cast' AS credit_type\nFROM _data d\n\
          CROSS JOIN LATERAL (SELECT * FROM json_each(to_json(d.credits)) -> '$.cast')\
          \ AS cm(cast_member)\nINNER JOIN silver_tv_entity_resolution er ON d.id =\
          \ er.tmdb_id\nWHERE cast_member.name IS NOT NULL\nUNION ALL\nSELECT\n  er.tconst\
          \ AS resolved_title_id,\n  crew_member.name AS person_name,\n  crew_member.job\
          \ AS role,\n  'crew' AS credit_type\nFROM _data d\nCROSS JOIN LATERAL (SELECT\
          \ * FROM json_each(to_json(d.credits)) -> '$.crew') AS cr(crew_member)\n\
