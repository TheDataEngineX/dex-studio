          \ tmdb_id)          AS title_count,\n  COUNT(DISTINCT CONCAT(CAST(tmdb_id\
          \ AS VARCHAR), '-', availability_type)) AS total_availabilities\nFROM _data\n\
          GROUP BY media_type, region, provider_name\nORDER BY media_type, region,\
          \ title_count DESC\n"
