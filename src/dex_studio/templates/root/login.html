<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — DEX Studio</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/studio.css?v={{ css_v }}">
  <script defer src="/static/vendor/alpine.min.js"></script>
  <script src="/static/vendor/lucide.min.js"></script>
  <script>
    (function () {
      const saved = localStorage.getItem('dex-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:var(--space-6);background:var(--bg)">
  <div class="card animate-scale-in" style="width:100%;max-width:420px;padding:var(--space-8)">
    <div style="text-align:center;margin-bottom:var(--space-8)">
      <div style="background:var(--accent-9);border-radius:var(--r-3);padding:12px;display:inline-flex;margin-bottom:var(--space-4)">
        <i data-lucide="zap" style="width:24px;height:24px;color:white"></i>
      </div>
      <h1 style="font-size:var(--text-2xl);font-weight:700;margin:0 0 var(--space-2);color:var(--text)">DEX Studio</h1>
      <p style="font-size:var(--text-sm);color:var(--text-3);margin:0">Enter your passphrase to continue</p>
    </div>

    {% if error %}
    <div class="card" style="background:color-mix(in oklch,var(--error-9) 8%,transparent);border-color:color-mix(in oklch,var(--error-9) 20%,transparent);padding:var(--space-3) var(--space-4);margin-bottom:var(--space-4);color:var(--error-11);font-size:var(--text-sm)">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login" x-data="{show:false}">
      <div style="margin-bottom:var(--space-4)">
        <label for="passphrase" style="display:block;font-size:var(--text-xs);font-weight:500;color:var(--text-2);margin-bottom:4px">Passphrase</label>
        <div style="position:relative">
          <input id="passphrase" :type="show ? 'text' : 'password'" name="passphrase"
                 placeholder="your passphrase"
                 autocomplete="current-password" autofocus required
                 class="input"
                 style="width:100%;padding-right:44px;font-family:var(--font-mono);font-size:13px">
          <button type="button" @click="show=!show"
                  style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-3);padding:2px">
            <svg x-show="!show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg x-show="show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn primary" style="width:100%;height:40px;font-size:var(--text-sm)">
        Sign In
      </button>
    </form>

    {% if oidc_enabled %}
    <div style="display:flex;align-items:center;gap:10px;margin:var(--space-6) 0">
      <div style="flex:1;height:1px;background:var(--border)"></div>
      <span style="font-size:var(--text-xs);color:var(--text-4)">or</span>
      <div style="flex:1;height:1px;background:var(--border)"></div>
    </div>
    <a href="/login/oidc" class="btn" style="width:100%;height:40px;font-size:var(--text-sm);display:flex;align-items:center;justify-content:center;text-decoration:none">
      Sign in with SSO
    </a>
    {% endif %}

    <p style="font-size:11px;color:var(--text-4);text-align:center;margin-top:var(--space-5)">
      Forgot your passphrase? Set <code style="font-size:10px;background:var(--bg-elev-2);padding:1px 5px;border-radius:var(--r-1)">DEX_STUDIO_PASSPHRASE</code> env var and restart.
    </p>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => lucide.createIcons());
  </script>
</body>
</html>
