[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dex-studio"
version = "0.0.1"
description = "dex runtime: loads and runs DataEngineX projects (Layer 1)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Jayapal Reddy Myaka" },
]
dependencies = [
    "dataenginex>=0.0.1,<0.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
dex = "dex_studio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dex_studio"]
